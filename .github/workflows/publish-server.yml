name: Publish Pulse Server

on:
  push:
    branches: [main]
    paths:
      - 'src/Pulse.Server/**'
      - 'src/Pulse.Contracts/**'
      - 'tests/Pulse.Server.Tests/**'
      - '.github/workflows/publish-server.yml'
      - '.dockerignore'
  pull_request:
    branches: [main]
    paths:
      - 'src/Pulse.Server/**'
      - 'src/Pulse.Contracts/**'
      - 'tests/Pulse.Server.Tests/**'
      - '.github/workflows/publish-server.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pulse-server

jobs:
  build-and-publish:
    name: Test, Build, and Publish Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test Pulse.Server
        run: |
          dotnet restore tests/Pulse.Server.Tests/Pulse.Server.Tests.csproj
          dotnet test tests/Pulse.Server.Tests/Pulse.Server.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Pulse.Server/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish digest summary
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "### Published Pulse.Server Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${IMAGE_LOWER}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
